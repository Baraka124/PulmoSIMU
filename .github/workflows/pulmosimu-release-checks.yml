name: PulmoSIMU release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Native Node regression suite
        run: |
          node --version
          node -e 'if(Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          node experimental/tests/run-release-checks.mjs
